<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    --app-bg:#F4F7FB;
    --chat-bg:#EEF2F7;

    --surface-2:#F7F9FC;

    --text-muted:#5B6472;
    --text-dim:#8B95A5;

    --accent-soft:#E8F3FF;
    --accent-soft-text:#0A2540;
    --selected-bg:#EFF6FF;
    --accent-border:#B7D9FF;
    --note-bg:#FFFBEB;
    --note-border:#FCD34D;
    --note-text:#7C4A08;
    --note-meta:#B08340;
    --amber-soft:#FEF3C7;
    --amber-text:#B45309;
    --green-soft:#E8F9EE;
    --green-text:#0E803C;
    --green-border:#A7E3C0;
    --red-soft:#FEE2E2;
    --red-text:#B91C1C;
    --red-border:#FCA5A5;
    --violet-soft:#EDE9FE;
    --violet-text:#6D28D9;
    --blue-soft:#E0F2FE;
    --blue-text:#0369A1;
    --cyan-soft:#E0F7FF;
    --cyan-text:#054452;
    --cyan-border:#B7E9FF;
    --slate-soft:#F1F5F9;

  }
  :root[data-theme="dark"]{
    --app-bg:#050A14;
    --chat-bg:#050A14;
    --surface:#0D121A;
    --surface-2:#141A24;
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --text:#FAFCFF;
    --text-muted:#A3AEBD;
    --text-dim:#7C8899;
    --toggle-off:#2A3442;
    --accent-soft:#0E335C;
    --accent-soft-text:#DCEBFF;
    --accent-soft-meta:#9CC3EE;
    --selected-bg:#141A24;
    --accent-border:rgba(53,217,255,0.28);
    --note-bg:#1E1A11;
    --note-border:rgba(255,182,92,0.4);
    --note-text:#FFD9A0;
    --note-meta:#C9A46A;
    --amber-soft:rgba(255,182,92,0.16);
    --amber-text:#FFB65C;
    --green-soft:rgba(16,185,129,0.16);
    --green-text:#34D399;
    --green-border:rgba(16,185,129,0.35);
    --red-soft:rgba(239,68,68,0.16);
    --red-text:#FCA5A5;
    --red-border:rgba(239,68,68,0.4);
    --violet-soft:rgba(139,92,246,0.18);
    --violet-text:#C4B5FD;
    --blue-soft:rgba(56,152,236,0.2);
    --blue-text:#7DD3FC;
    --cyan-soft:#0A2C38;
    --cyan-text:#7FE7FF;
    --cyan-border:rgba(53,217,255,0.3);
    --slate-soft:rgba(255,255,255,0.07);
    --slate-text:#A3AEBD;
    --pink-soft:rgba(225,48,108,0.18);
    --pink-text:#F9A8D4;
    --indigo-soft:rgba(99,102,241,0.2);
    --indigo-text:#C7D2FE;
  }
  html,body{background:var(--app-bg);color:var(--text);}
  ::-webkit-scrollbar-thumb{background:var(--toggle-off);}
  a{color:#168CFF;}
  a:hover{color:#35D9FF;}
  html,body{margin:0;padding:0;height:100%;}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--toggle-off);border-radius:8px;}
  input::placeholder, textarea::placeholder{color:var(--text-dim);}
</style>
<script>
(function(){
  try{ var t = localStorage.getItem("solint-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
  if(!window.__solintThemeBound){
    window.__solintThemeBound = true;
    document.addEventListener("click", function(e){
      var el = e.target && e.target.closest ? e.target.closest("[data-theme-toggle]") : null;
      if(!el) return;
      var root = document.documentElement;
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try{ localStorage.setItem("solint-theme", next); }catch(err){}
    });
  }
})();
</script>
</helmet>

<div style="display:flex;width:100vw;height:100vh;min-width:1280px;background:var(--app-bg);font-family:'Inter',sans-serif;color:var(--text);overflow-x:auto;overflow-y:hidden;">

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    status: 'online',
    notifPrefs: [
      {id:'assigned', label:'Conversa atribuída a mim', on:true},
      {id:'mention', label:'Menções em notas internas', on:true},
      {id:'sla', label:'SLA prestes a estourar', on:true},
      {id:'campaign', label:'Campanhas concluídas', on:false},
      {id:'email', label:'Resumo diário por email', on:false}
    ]
  };

  setStatus(s){ return () => this.setState({status:s}); }
  togglePref(id){
    return () => this.setState(st => ({notifPrefs: st.notifPrefs.map(p => p.id===id ? {...p, on:!p.on} : p)}));
  }

  renderVals(){
    const statusDefs = [
      {id:'online', label:'Disponível', dot:'#10B981'},
      {id:'busy', label:'Ocupado', dot:'#EF4444'},
      {id:'away', label:'Ausente', dot:'#F59E0B'}
    ];
    const statusOptions = statusDefs.map(s => ({
      label:s.label, dot:s.dot,
      bg: this.state.status===s.id ? 'var(--selected-bg)' : 'var(--surface)',
      border: this.state.status===s.id ? '#168CFF' : 'var(--border)',
      onSelect: this.setStatus(s.id)
    }));

    const notifPrefs = this.state.notifPrefs.map(p => ({
      label:p.label,
      bg: p.on ? '#168CFF' : 'var(--toggle-off)',
      dotLeft: p.on ? '18px' : '2px',
      onToggle: this.togglePref(p.id)
    }));

    const workspaces = [
      {name:'Solint Demo', role:'Administrador', initial:'S', color:'#174EFF', current:true, notCurrent:false, bg:'var(--selected-bg)', border:'var(--accent-border)'},
      {name:'Agência Delta', role:'Agente', initial:'D', color:'#8B5CF6', current:false, notCurrent:true, bg:'var(--surface)', border:'var(--border)'}
    ];

    return {
      statusColor: statusDefs.find(s=>s.id===this.state.status).dot,
      statusOptions, notifPrefs, workspaces
    };
  }
}

</script>
</body>
